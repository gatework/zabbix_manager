require:
  - rubocop-packaging
  - rubocop-performance

AllCops:
  TargetRubyVersion: 2.7
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "coverage/**/*"
    - "doc/**/*"
    - "measurement/**/*"
    - "pkg/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Lint:
  Enabled: true

Security:
  Enabled: true

Performance:
  Enabled: true

Packaging:
  Enabled: true

Layout:
  Enabled: true

# 锁定的 RuboCop 1.26 在 Ruby 4 下执行这两条规则会崩溃，升级前保留其余布局规则。
Layout/IndentationConsistency:
  Enabled: false

Layout/IndentationWidth:
  Enabled: false

Layout/LineLength:
  Enabled: true
  Max: 120

Style/AndOr:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/HashSyntax:
  Enabled: true

Style/RedundantFreeze:
  Enabled: true

Style/RedundantReturn:
  Enabled: true

Style/Semicolon:
  Enabled: true

Style/SpecialGlobalVars:
  Enabled: true

Metrics/ClassLength:
  Enabled: true
  Max: 400
  Exclude:
    - "spec/**/*"
    # Monitoring 聚合设备、接口和线路阈值编排，按业务边界保留在一个公开入口。
    - "lib/zabbix_manager/monitoring.rb"

Metrics/MethodLength:
  Enabled: true
  Max: 45
  Exclude:
    - "spec/**/*"
