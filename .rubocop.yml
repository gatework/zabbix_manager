plugins:
  - rubocop-packaging
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.4
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "coverage/**/*"
    - "doc/**/*"
    - "measurement/**/*"
    - "pkg/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Lint:
  Enabled: true

Security:
  Enabled: true

Performance:
  Enabled: true

Packaging:
  Enabled: true

Layout:
  Enabled: true

Layout/LineLength:
  Enabled: true
  Max: 120

Style/AndOr:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/RedundantFreeze:
  Enabled: true

Style/RedundantReturn:
  Enabled: true

Style/Semicolon:
  Enabled: true

Style/SpecialGlobalVars:
  Enabled: true

Metrics/ClassLength:
  Enabled: true
  Max: 400
  Exclude:
    - "spec/**/*"

Metrics/MethodLength:
  Enabled: true
  Max: 45
  Exclude:
    - "spec/**/*"

Style/For:
  Enabled: true

Style/EachForSimpleLoop:
  Enabled: true

Style/MapToHash:
  Enabled: true

Style/HashSyntax:
  Enabled: true
  EnforcedShorthandSyntax: either
